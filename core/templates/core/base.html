<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  {# block title: cada plantilla hija puede poner su propio título #}
  <title>{% block title %}Servicios{% endblock %}</title>
  {# mismo Play CDN de Tailwind que en las semanas anteriores #}
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* estilos mínimos para los campos que genera form.as_p */
    form p { margin-bottom: 1rem; }
    form label { display: block; font-weight: 600; margin-bottom: 0.25rem; }
    form input, form textarea {
      width: 100%;
      border: 1px solid #cbd5e1;
      border-radius: 0.375rem;
      padding: 0.5rem 0.75rem;
    }
    form textarea { height: 7rem; }
    /* errorlist: la lista que Django pinta cuando un campo no pasa la validación */
    .errorlist { color: #dc2626; font-size: 0.875rem; margin-bottom: 0.25rem; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800">
  <main class="max-w-3xl mx-auto py-10 px-6">
    {# block content: aquí cada plantilla hija mete su contenido #}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
